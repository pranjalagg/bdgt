<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#f3f4f1" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0e0f11" media="(prefers-color-scheme: dark)" />
		<meta name="text-scale" content="scale" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<script>
			(function() {
				const stored = localStorage.getItem('theme-preference');
				const preference = stored === 'light' || stored === 'dark' ? stored : 'system';
				const isDark = preference === 'dark' ||
					(preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
				if (isDark) {
					document.documentElement.classList.add('dark');
				}
				// Apply "hide amounts" before first paint so figures never flash.
				try {
					if (localStorage.getItem('bdgt-hide-amounts') === 'true') {
						document.documentElement.classList.add('privacy');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
