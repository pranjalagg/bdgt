name: Android test build

# Runs only for the Android branch (and by hand); the live site is deployed
# separately and never from here.
on:
  push:
    branches: [claude/intelligent-davinci-7qblqz]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vitest run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # The app is served from the root inside Android. Repository variables,
      # all public by design (never secrets): without them the app has no Sync
      # section, as before.
      - run: BASE_PATH= npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
      # Development helpers (fake phone, sample payments) live behind
      # import.meta.env.DEV and must never ship.
      - name: No development helpers in the build
        run: |
          if grep -rlE '__bdgt[A-Za-z]+' build/; then echo "Development helpers found in the build"; exit 1; fi
      - run: npx cap sync android
      # The same signing key every run, so a new test build installs over the
      # last one and Google keeps recognising the app. It lives in a
      # repository secret (docs/android-setup.md). Until that exists, a key made
      # on the first run is kept in the Actions cache, which GitHub empties
      # after 7 days without a build.
      - name: Signing key (repository secret)
        id: secret_key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ~/bdgt-debug.keystore
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Signing key (cache)
        id: keystore
        if: steps.secret_key.outputs.found != 'true'
        uses: actions/cache@v4
        with:
          path: ~/bdgt-debug.keystore
          key: bdgt-debug-keystore-v1
      - name: Signing key (create on first run)
        if: steps.secret_key.outputs.found != 'true' && steps.keystore.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -v -keystore ~/bdgt-debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"
      # Google only lets an app signed with a registered key ask for sign-in:
      # this is the SHA-1 to give the Android client in Google Cloud.
      - name: Signing key fingerprint
        run: |
          sha1=$(keytool -list -v -keystore ~/bdgt-debug.keystore -storepass android -alias androiddebugkey | awk '/SHA1:/ {print $2}')
          echo "Signing key SHA-1: $sha1"
          echo "Signing key SHA-1 (Google Cloud → Android OAuth client): \`$sha1\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Unit tests and debug APK
        working-directory: android
        env:
          BDGT_DEBUG_KEYSTORE: /home/runner/bdgt-debug.keystore
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bdgt-test-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
