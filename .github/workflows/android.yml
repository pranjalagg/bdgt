name: Android test build

# Runs only for the Android branch (and by hand); the live site is deployed
# separately and never from here.
on:
  push:
    branches: [claude/intelligent-davinci-7qblqz]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx vitest run

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      # The app is served from the root inside Android, and has no Supabase
      # settings: Google sign-in inside the app comes in a later stage.
      - run: BASE_PATH= npm run build
      - run: npx cap sync android
      # The same debug key every run, so a new test build installs over the
      # last one instead of needing an uninstall.
      - name: Debug signing key (restore)
        id: keystore
        uses: actions/cache@v4
        with:
          path: ~/bdgt-debug.keystore
          key: bdgt-debug-keystore-v1
      - name: Debug signing key (create on first run)
        if: steps.keystore.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -v -keystore ~/bdgt-debug.keystore -storepass android
          -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000
          -dname "CN=Android Debug,O=Android,C=US"
      - name: Unit tests and debug APK
        working-directory: android
        env:
          BDGT_DEBUG_KEYSTORE: /home/runner/bdgt-debug.keystore
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: bdgt-test-build-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
